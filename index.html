<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Good Taste | Tiny Foods. Big Personality.</title>

    <link rel="stylesheet" href="style.css">

    <!-- Snipcart -->
    <link rel="stylesheet"
          href="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.css">

    <script async
            src="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.js">
    </script>

    <div hidden id="snipcart"
         data-api-key="YOUR_SNIPCART_PUBLIC_API_KEY">
    </div>
</head>

<body>

<header class="hero">
    <div class="container">
        <h1>Just Good Taste</h1>

        <p class="tagline">
            Tiny foods. Big personality.
        </p>

        <p class="subheading">
            Handmade miniature food earrings inspired by favorite snacks,
            bakery treats, and nostalgic comfort foods.
        </p>

        <a href="#shop" class="button">
            Shop Earrings
        </a>
    </div>
</header>

<section id="shop" class="products">
    <div class="container">

        <!-- Categories and products inserted here -->
        <div id="catalog"></div>

    </div>
</section>

<footer>
    <p>
        Handmade food jewelry designed to make everyday outfits a little more fun.
    </p>

    <button class="snipcart-checkout button">
        Cart (
        <span class="snipcart-items-count"></span>
        )
    </button>
</footer>

<script src="script.js"></script>

</body>
</html>
